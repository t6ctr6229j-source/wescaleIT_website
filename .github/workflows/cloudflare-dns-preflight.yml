name: Cloudflare DNS and DNSSEC preflight
on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-dns-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Independently check wescaleIT, FCTH and Psoydo DNSSEC delegations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          domains = ('wescaleit.com', 'ciso2hero.com', 'psoydo.com')
          resolvers = ('https://dns.google/resolve', 'https://cloudflare-dns.com/dns-query')
          failed = False
          for domain in domains:
              for resolver in resolvers:
                  url = resolver + '?' + urlencode({'name':domain,'type':'DS'})
                  with urlopen(Request(url, headers={'Accept':'application/dns-json'}),timeout=25) as resp:
                      body = json.load(resp)
                  if body.get('Status') != 0:
                      raise SystemExit(f'{domain}: DS lookup error {body.get("Status")} from {resolver}')
                  ds = [x for x in body.get('Answer',[]) if x.get('type') == 43]
                  print(domain, 'resolver='+resolver.split('//')[1].split('/')[0], 'parent-DS-count='+str(len(ds)))
                  if ds: failed=True
          if failed:
              raise SystemExit('BLOCKED: One or more active DS records require DNSSEC migration planning before delegating')
          print('PASS: no DS record reported for the three zones by either resolver')
          PY
