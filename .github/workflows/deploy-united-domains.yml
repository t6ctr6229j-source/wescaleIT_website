name: Build and deploy wescaleIT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wescaleit-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check site and consent
        run: |
          python3 scripts/check_site.py
          node --check js/dachmarke.js
          node scripts/check_analytics.cjs
          python3 scripts/build_release.py --production
      - uses: actions/upload-artifact@v4
        with:
          name: wescaleit-production
          path: dist/wescaleit/
          include-hidden-files: true
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y python3-paramiko
      - name: Deploy dedicated wescaleit directory
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_PORT: ${{ secrets.UD_SFTP_PORT }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          UD_SFTP_KNOWN_HOSTS: ${{ secrets.UD_SFTP_KNOWN_HOSTS }}
        run: /usr/bin/python3 scripts/deploy_sftp.py
      - name: Check public domain routing
        run: python3 scripts/verify_public.py
