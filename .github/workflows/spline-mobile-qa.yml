name: Diagnose mobile Spline canvas
on:
  pull_request:
    paths:
      - '.github/workflows/spline-mobile-qa.yml'
      - 'scripts/diagnose-mobile-spline.cjs'
      - 'js/hero-blob.js'
      - 'css/hero-blob.css'
      - 'images/kununu-top-company-2027-aligned.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Inspect mobile iPhone-ish viewport on public site
        run: node scripts/diagnose-mobile-spline.cjs
