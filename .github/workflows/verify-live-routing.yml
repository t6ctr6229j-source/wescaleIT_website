name: Diagnose wescaleIT live routing
on:
  pull_request:
    paths:
      - '.github/workflows/verify-live-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe live domain, headers and deployed badge
        shell: bash
        run: |
          set -uo pipefail
          for url in \
            "https://wescaleit.com/" \
            "https://www.wescaleit.com/" \
            "https://wescaleit.com/release.json?probe=github" \
            "https://wescaleit.com/images/kununu-top-company-2027-aligned.svg" \
            "https://wescaleit.com/kontakt" \
            "https://wescaleit.com/robots.txt"; do
            echo "URL: $url"
            curl -sS -L --max-redirs 8 --max-time 28 --dump-header /tmp/wescale-headers --output /tmp/wescale-body --write-out 'HTTP=%{http_code} FINAL=%{url_effective} REMOTE_IP=%{remote_ip} TLS_VERIFY=%{ssl_verify_result}\n' "$url" || echo "Transport failed"
            grep -iE '^(HTTP/|server:|location:|cf-ray:|content-security-policy:|x-content-type-options:)' /tmp/wescale-headers | tail -n 9 || true
            if echo "$url" | grep -q 'release.json'; then head -c 180 /tmp/wescale-body | tr '\n' ' '; echo; fi
          done

      - name: Verify Python urllib behavior against the same URL
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          for ua in (None, 'Mozilla/5.0 (compatible; wescaleIT-ReleaseVerifier/1.0; +https://wescaleit.com)'):
              headers={} if ua is None else {'User-Agent':ua}
              for path in ('/release.json', '/images/kununu-top-company-2027-aligned.svg'):
                  request=Request('https://wescaleit.com'+path,headers=headers)
                  try:
                      with urlopen(request,timeout=20) as r:
                          print('CLIENT',ua or 'Python default','PATH',path,'STATUS',r.status,'SERVER',r.headers.get('Server'))
                  except HTTPError as e:
                      print('CLIENT',ua or 'Python default','PATH',path,'STATUS',e.code,'SERVER',e.headers.get('Server'))
          PY
