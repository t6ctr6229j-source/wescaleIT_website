<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wescaleIT Responsive-Prüfung</title><meta name="robots" content="noindex,nofollow"><style>body{font:16px system-ui;margin:24px;background:#eee;color:#222}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}label{display:flex;gap:8px;align-items:center}iframe{height:780px;border:1px solid #777;background:white;display:block;max-width:none}select{font:inherit;padding:6px}</style><h1>Responsive-Prüfung</h1><p>Prüfansicht für die Live-Website. Wird nicht in den Produktions-Build übernommen.</p><nav><label>Seite <select id="page"><option value="/">Startseite</option><option value="/ueber-uns">Haltung &amp; Team</option></select></label><label>Breite <select id="width"><option value="390">Mobil 390 px</option><option value="768">Tablet 768 px</option><option value="1280">Desktop 1280 px</option></select></label></nav><iframe id="preview" title="Website-Prüfansicht" width="390" src="https://wescaleit.com/"></iframe><script>const frame=document.getElementById('preview');document.getElementById('page').addEventListener('change',e=>frame.src='https://wescaleit.com'+e.target.value);document.getElementById('width').addEventListener('change',e=>frame.width=e.target.value);</script></html>
